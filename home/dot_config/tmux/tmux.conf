# Managed by chezmoi from /srv/archon (spec 011-shell). Do not edit here.
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"
set -g mouse on
set -g history-limit 50000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g escape-time 10
if-shell "test -x /usr/bin/fish" "set -g default-shell /usr/bin/fish"
# The terminal title (spec 011): "<command> in <user>@<host>", like the shells' own titles.
set -g set-titles on
set -g set-titles-string "#{pane_current_command} in #(whoami)@#h"
