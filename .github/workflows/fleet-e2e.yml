# A fleet repository's end-to-end lab (tests/e2e/fleet.sh, spec 046): its
# synthetic fleet's server installs from a blank Secure Boot VM to Ready with
# the engine its package.json pins (the release tarball, checked against its
# bun.lock), reboots, and a workstation set up from the repository reaches it
# over MCP. Everything runs on the Bun the engine pins (spec 096).
#
# Called from the fleet repository, at the same tag as its pin (archon fleet
# upgrade moves both together):
#
#   jobs:
#     e2e:
#       uses: intellectual-frontiers/stolos/.github/workflows/fleet-e2e.yml@v0.14.0
#       with: { fleet: synthetic-uat, server: e2e-server-uat, workstation: e2e-workstation-uat }
#
# Nothing secret is needed: every key and password of a run is made by it and
# thrown away. The lab scripts come from the engine at the fleet's pin.
name: fleet-e2e

on:
  workflow_call:
    inputs:
      fleet:
        description: The synthetic fleet's id (fleets/<id>/).
        required: true
        type: string
      server:
        description: Its server host (network-booted and installed).
        required: true
        type: string
      workstation:
        description: Its workstation (set up with stolos workstation add); empty to skip.
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  install:
    runs-on: ubuntu-24.04
    # About 8 minutes on a private runner (bootstrap), 20 on a public one; a hung VM
    # must not hold a runner (or private minutes) for long.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
        with:
          path: fleet
      - name: The engine's tag, from the pin (package.json's release URL)
        id: pin
        run: |
          url=$(grep -oE 'https://github\.com/[^/]+/[^/]+/releases/download/v[0-9]+\.[0-9]+\.[0-9]+/[^"]+\.tgz' fleet/package.json | head -n 1)
          [ -n "$url" ] || { echo "::error::fleet/package.json names no engine release tarball"; exit 1; }
          tag=$(printf '%s' "$url" | grep -oE '/v[0-9]+\.[0-9]+\.[0-9]+/' | tr -d /)
          repo=$(printf '%s' "$url" | cut -d/ -f4,5)
          echo "tag=$tag" >>"$GITHUB_OUTPUT"
          echo "repo=$repo" >>"$GITHUB_OUTPUT"
          echo "engine $repo at $tag"
      - uses: actions/checkout@v5
        with:
          repository: ${{ steps.pin.outputs.repo }}
          ref: ${{ steps.pin.outputs.tag }}
          path: stolos
          persist-credentials: false
      - name: Bun (the engine's pin, SHA-256 checked) and Node 26.13.1
        uses: ./stolos/.github/actions/bun
        with:
          engine: stolos
      - name: The engine's own dependencies (the lab's scripts), exactly as its bun.lock holds them
        working-directory: stolos
        run: bun install --frozen-lockfile
      - name: KVM for this runner
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' |
            sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm || echo "::warning::no KVM on this runner: the VMs are emulated (much slower)"
          nproc; free -m
      - name: QEMU, OVMF, dnsmasq, cloud-image-utils
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q qemu-system-x86 qemu-utils ovmf dnsmasq-base cloud-image-utils netcat-openbsd parted
      - name: Install, reboot, and reach the synthetic fleet
        env:
          # For the lab's GitHub API mirror (tool releases); it never leaves the runner.
          GITHUB_TOKEN: ${{ github.token }}
          FLEET: ${{ inputs.fleet }}
          SERVER: ${{ inputs.server }}
          WORKSTATION: ${{ inputs.workstation }}
        run: stolos/tests/e2e/fleet.sh fleet "$FLEET" "$SERVER" "$WORKSTATION"
      - name: Logs readable (QEMU writes them as root; a cancelled run skips the lab's own fix)
        if: always()
        run: sudo chmod -R a+rX stolos/tests/e2e/work 2>/dev/null || true
      - name: Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fleet-e2e-logs
          path: |
            stolos/tests/e2e/work/
            !stolos/tests/e2e/work/*.qcow2
            !stolos/tests/e2e/work/*.fd
            !stolos/tests/e2e/work/*.iso
            !stolos/tests/e2e/work/*.sock
          if-no-files-found: ignore
          retention-days: 14
