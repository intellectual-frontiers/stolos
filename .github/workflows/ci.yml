# Specs 046-engine-instance, 096-bun-runtime and 114-release-record: every push and pull request
# is checked on the pinned Bun (and Node 26, the backup runtime); every push to main must raise
# the version in src/archon/version.ts (package.json and release.ts follow it), and once
# everything passes the commit is installed as a Git dependency into an empty project and run on
# Bun and on Node, then tagged stolos-v<version> (an annotated tag, made by commons' versions
# tool). The tag is the release: no GitHub release, no tarball, no build. A fleet repository
# depends on it by Git (package.json: "github:intellectual-frontiers/stolos#stolos-v<version>");
# bun.lock pins its commit.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Bun (pinned, SHA-256 checked) and Node 26.13.1
        uses: ./.github/actions/bun
      - name: Dependencies, exactly as bun.lock holds them
        run: bun install --frozen-lockfile
      - name: Generated files are fresh
        run: bun tools/gen-assets.ts --check
      - name: Types (TypeScript 7)
        run: bun run check
      - name: Lint (Bun, with IFC TypeScript's plugin)
        run: bun run lint
      - name: Format
        run: bun run fmt:check
      - name: Documentation (ifc-docs check, every @example compiles; specs 055, 096 FR-009)
        run: bun run docs:lint
      - name: The ontology, the trace and the layers (spec 101-ladder)
        run: bun run check:ontology && bun run check:trace && bun run check:layers
      - name: snmpd, for the SNMPv3 test against a real agent (spec 069)
        run: sudo apt-get install -y --no-install-recommends snmpd >/dev/null && sudo systemctl stop snmpd || true
      - name: osquery 5.24.1, the official .deb at a pinned SHA-256, for the ATC test (spec 093)
        run: |
          curl -fsSL -o /tmp/osquery.deb https://pkg.osquery.io/deb/pool/deb/main/o/osquery/osquery_5.24.1-1.linux_amd64.deb
          echo "c6a37aec1156712cce0fafeb01a3697a2b73a1863a2b39fc3473b07600aea68d  /tmp/osquery.deb" | sha256sum -c -
          sudo dpkg -i /tmp/osquery.deb >/dev/null && osqueryi --version
      - name: The SCF 2026.3 workbook and NIST's catalogs, each at its pinned SHA-256, into this PC's catalog cache (spec 071 FR-001)
        run: bun run stolos compliance catalog && test -s "$HOME/.local/share/stolos/catalogs/scf-2026.3.json"
      - name: Tests (ifc test, on Bun and on Node; every report and the evidence ledger)
        run: bun run test:ci
        env:
          STOLOS_REQUIRE_OSQUERY: "1"
          STOLOS_REQUIRE_SCF: "1"
      - name: The test record, its reports and the ledger
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-linux
          path: test-results/
          if-no-files-found: warn
          retention-days: 90
      - name: The version was raised (push to main)
        if: github.event_name == 'push'
        run: |
          if git rev-parse -q --verify HEAD^ >/dev/null; then
            bun run version check HEAD^
          else
            bun run version show
          fi
      - name: The version is newer than main (pull request)
        if: github.event_name == 'pull_request'
        run: bun run version check origin/${{ github.base_ref }}
      # Spec 114-release-record FR-009: commons' check of works (0026-works-versioning FR-022), offline and
      # path-scoped: the files of the work changed and its record's version did not grow.
      - name: The work's record and its version (commons' versions check, push to main)
        if: github.event_name == 'push'
        run: |
          if git rev-parse -q --verify HEAD^ >/dev/null; then
            bun node_modules/@intellectual-frontiers/commons/commons/ts/mizan/versions.ts check --base HEAD^
          else
            echo "the first commit: nothing to compare with"
          fi
      - name: The work's record and its version (commons' versions check, pull request)
        if: github.event_name == 'pull_request'
        run: bun node_modules/@intellectual-frontiers/commons/commons/ts/mizan/versions.ts check --base origin/${{ github.base_ref }}

  suite:
    # Spec 096 FR-004: the parts of the suite that apply on macOS and Windows, on Bun.
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Bun (pinned, SHA-256 checked) and Node 26.13.1
        uses: ./.github/actions/bun
      - name: Dependencies, exactly as bun.lock holds them
        run: bun install --frozen-lockfile
      - name: Tests (ifc test, on Bun)
        # The requirements are held to the whole suite on Linux (the check job): tests that apply
        # only there are skipped here, each with its reason.
        run: bun run test --no-requirements
      - name: The test record and its reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ runner.os }}
          path: test-results/
          if-no-files-found: warn
          retention-days: 90

  bootstrap-windows:
    # Spec 062: bin/bootstrap.windows.ps1, run for real on Windows, in
    # PowerShell 7 and in Windows PowerShell 5.1 (what a new PC has).
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Bun (pinned, SHA-256 checked) and Node 26.13.1
        uses: ./.github/actions/bun
      - name: Dependencies, exactly as bun.lock holds them
        run: bun install --frozen-lockfile
      - name: PowerShell 7
        shell: pwsh
        run: pwsh -NoProfile -File tests/bootstrap/windows-check.ps1 pwsh
      - name: Windows PowerShell 5.1
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tests/bootstrap/windows-check.ps1 powershell
      - name: integrate and the Windows probe (spec 069)
        shell: pwsh
        run: pwsh -NoProfile -File tests/integrate/windows-check.ps1

  integrate-posix:
    # Spec 069: bin/integrate.sh and the probe on other Linux distributions (BusyBox
    # included: Alpine) and on macOS, for real.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Bun (pinned, SHA-256 checked) and Node 26.13.1
        uses: ./.github/actions/bun
      - name: Dependencies, exactly as bun.lock holds them
        run: bun install --frozen-lockfile
      - name: The integrate tests (discover, adopt, undo, the checksum)
        run: bun run test tests/integrate069.test.ts
      - name: Distributions (Debian, Fedora, Arch, Alpine with BusyBox)
        if: runner.os == 'Linux'
        run: |
          for img in debian:12 fedora:41 archlinux:latest alpine:3.20; do
            docker run --rm -v "$PWD:/s:ro" -e STOLOS_RAW=/s -w /tmp "$img" sh /s/bin/integrate.sh > "out-${img%%:*}.txt" 2>&1 || { cat "out-${img%%:*}.txt"; exit 1; }
            bun tests/integrate/check-code.ts "out-${img%%:*}.txt" "" discover > /dev/null && echo "$img: ok"
          done
      - name: macOS discover
        if: runner.os == 'macOS'
        run: |
          STOLOS_RAW="$PWD" sh bin/integrate.sh > out-mac.txt 2>&1 || { cat out-mac.txt; exit 1; }
          bun tests/integrate/check-code.ts out-mac.txt macos discover

  console-browser:
    # Spec 065: the Archon Console in a real browser (Chromium), at desktop and phone width.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Bun (pinned, SHA-256 checked) and Node 26.13.1
        uses: ./.github/actions/bun
      - name: Dependencies, exactly as bun.lock holds them
        run: bun install --frozen-lockfile
      - name: Playwright and Chromium
        run: |
          mkdir -p /tmp/pw && cd /tmp/pw && npm init -y >/dev/null
          npm install --silent playwright@1.63.0
          npx playwright install --with-deps chromium
      - name: The console in a browser
        run: |
          bun tests/console/serve.ts 8099 &
          for _ in $(seq 1 60); do curl -sf http://127.0.0.1:8099/healthz && break; sleep 1; done
          NODE_PATH=/tmp/pw/node_modules node tests/console/browser.cjs 8099
      - name: The Stolos Console in a browser (spec 066)
        run: |
          bun tests/console/serve-stolos.ts 8098 &
          for _ in $(seq 1 60); do curl -sf http://127.0.0.1:8098/healthz && break; sleep 1; done
          NODE_PATH=/tmp/pw/node_modules node tests/console/stolos-browser.cjs 8098

  release:
    # Spec 096 FR-005: on a push to main that passed everything, this commit installed as a Git
    # dependency (git+file:) into an empty project and run on Bun and on Node 26, then the annotated
    # tag stolos-v<version>, which is the release (spec 114-release-record). Then this version's
    # documentation (spec 055).
    needs: [check, suite, bootstrap-windows, integrate-posix, console-browser]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Bun (pinned, SHA-256 checked) and Node 26.13.1
        uses: ./.github/actions/bun
      - name: Dependencies, exactly as bun.lock holds them
        run: bun install --frozen-lockfile
      - name: This commit as a fleet installs it (git+file:), archon and stolos --version on Bun and on Node
        run: bun tools/smoke.ts --repo "$GITHUB_WORKSPACE" --commit "$GITHUB_SHA"
      - name: Tag stolos-v<version>
        id: tag
        # An annotated tag whose message holds the commit and the tree hash (commons 0026
        # FR-018). CI has no signing key, so it is not signed: a signed tag is a later item.
        run: |
          TAG="$(bun tools/version.ts tag)"
          echo "tag=$TAG" >>"$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            if [ "$(git rev-list -n 1 "$TAG")" = "$(git rev-parse HEAD)" ]; then
              echo "$TAG already tags this commit"
            else
              echo "::error::$TAG already tags another commit: raise the version" && exit 1
            fi
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            bun node_modules/@intellectual-frontiers/commons/commons/ts/mizan/versions.ts tag "$(bun tools/version.ts slug)"
            git push origin "$TAG"
          fi
      # Spec 055: this version's documentation, on GitHub Pages (the gh-pages
      # branch): /stolos-vX.Y.Z/ for each release, /latest/ for the newest, the last 20 kept.
      - name: Documentation (IFC Docs, docs.config.ts, into out/docs)
        run: bun run docs
      - name: Publish to the gh-pages branch
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          rm -rf ../pages
          if git ls-remote --exit-code origin gh-pages >/dev/null; then
            git clone -q --depth 1 --branch gh-pages "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ../pages
          else
            mkdir ../pages && git -C ../pages init -q -b gh-pages
            git -C ../pages remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          fi
          rm -rf "../pages/$TAG" ../pages/latest
          cp -r out/docs "../pages/$TAG"
          cp -r out/docs ../pages/latest
          # Keep the newest 20 versions.
          ls -d ../pages/stolos-v*/ 2>/dev/null | sed 's#.*/\(stolos-v[0-9.]*\)/#\1#' | sort -V | head -n -20 |
            while read -r old; do rm -rf "../pages/$old"; done
          printf '<!DOCTYPE html><meta http-equiv="refresh" content="0; url=latest/index.html"><a href="latest/index.html">Stolos documentation</a>\n' >../pages/index.html
          touch ../pages/.nojekyll
          git -C ../pages add -A
          git -C ../pages -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "docs: $TAG" || echo "no change"
          git -C ../pages push -q origin gh-pages
        env:
          GITHUB_TOKEN: ${{ github.token }}
