# Spec 046-engine-instance: every push and pull request is checked; every push
# to main must raise the version in src/archon/version.ts, and is tagged
# v<version> so fleets can pin @stolos/ to it (raw GitHub URLs need a tag).
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Generated files are fresh
        run: deno run -A tools/gen-assets.ts --check
      - name: Types
        run: deno task check
      - name: Lint
        run: deno lint
      - name: Format
        run: deno fmt --check
      - name: Documentation (JSDoc problems may only go down; spec 055)
        run: deno task docs:lint
      - name: Tests
        run: deno task test
      - name: The version was raised (push to main)
        if: github.event_name == 'push'
        run: |
          if git rev-parse -q --verify HEAD^ >/dev/null; then
            deno task version check HEAD^
          else
            deno task version show
          fi
      - name: The version is newer than main (pull request)
        if: github.event_name == 'pull_request'
        run: deno task version check origin/${{ github.base_ref }}

  bootstrap-windows:
    # Spec 062: bin/bootstrap.windows.ps1, run for real on Windows, in
    # PowerShell 7 and in Windows PowerShell 5.1 (what a new PC has).
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: PowerShell 7
        shell: pwsh
        run: pwsh -NoProfile -File tests/bootstrap/windows-check.ps1 pwsh
      - name: Windows PowerShell 5.1
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tests/bootstrap/windows-check.ps1 powershell

  tag:
    needs: [check, bootstrap-windows]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Tag v<version>
        run: |
          TAG="v$(deno run -A tools/version.ts show)"
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            if [ "$(git rev-list -n 1 "$TAG")" = "$(git rev-parse HEAD)" ]; then
              echo "$TAG already tags this commit"
            else
              echo "::error::$TAG already tags another commit: raise the version" && exit 1
            fi
          else
            git tag "$TAG"
            git push origin "$TAG"
          fi
      # Spec 055: this version's documentation, on GitHub Pages (the gh-pages
      # branch): /vX.Y.Z/ for each release, /latest/ for the newest, the last 20 kept.
      - name: Documentation (HTML from deno doc)
        run: deno task docs out/docs
      - name: Publish to the gh-pages branch
        run: |
          TAG="v$(deno run -A tools/version.ts show)"
          rm -rf ../pages
          if git ls-remote --exit-code origin gh-pages >/dev/null; then
            git clone -q --depth 1 --branch gh-pages "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ../pages
          else
            mkdir ../pages && git -C ../pages init -q -b gh-pages
            git -C ../pages remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          fi
          rm -rf "../pages/$TAG" ../pages/latest
          cp -r out/docs "../pages/$TAG"
          cp -r out/docs ../pages/latest
          # Keep the newest 20 versions.
          ls -d ../pages/v*/ 2>/dev/null | sed 's#.*/\(v[0-9.]*\)/#\1#' | sort -V | head -n -20 |
            while read -r old; do rm -rf "../pages/$old"; done
          printf '<!DOCTYPE html><meta http-equiv="refresh" content="0; url=latest/index.html"><a href="latest/index.html">Stolos documentation</a>\n' >../pages/index.html
          touch ../pages/.nojekyll
          git -C ../pages add -A
          git -C ../pages -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "docs: $TAG" || echo "no change"
          git -C ../pages push -q origin gh-pages
        env:
          GITHUB_TOKEN: ${{ github.token }}
