# Spec 004 SC-001 (specs 046 to 049): install a blank Secure Boot VM end to
# end, from network boot to Ready, with the engine of this commit; reboot it;
# then set up a workstation that reaches it over MCP (tests/e2e/ci.sh). Long (Ubuntu's image and a full install), so it runs on
# pushes to main and by hand, separately from ci.yml's checks and tag.
name: e2e

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      vm_mem:
        description: The server VM's memory in MiB (empty for the lab's choice; 5888 is a private runner's).
        required: false
        default: ""
      install:
        description: How the server is installed (network or bootstrap; empty for the lab's choice).
        required: false
        default: ""
      squeeze_mb:
        description: Hold this much of the runner's memory (8192 tries a private runner's 8 GB).
        required: false
        default: ""

# One run at a time per branch. On main every version gets its complete run
# (newer pushes wait); elsewhere a newer push replaces the run in progress.
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  install:
    runs-on: ubuntu-24.04
    # A run takes about 11 minutes; a hung VM must not hold a runner for hours.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - name: Bun (pinned, SHA-256 checked) and Node 26.13.1
        uses: ./.github/actions/bun
      - name: Dependencies, exactly as bun.lock holds them
        run: bun install --frozen-lockfile
      - name: KVM for this runner
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' |
            sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
      - name: QEMU, OVMF, dnsmasq, cloud-image-utils
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q qemu-system-x86 qemu-utils ovmf dnsmasq-base cloud-image-utils netcat-openbsd parted
      - name: Install a VM end to end
        env:
          # For the lab's GitHub API mirror (tool releases); it never leaves the runner.
          GITHUB_TOKEN: ${{ github.token }}
          E2E_VM_MEM: ${{ inputs.vm_mem }}
          E2E_SQUEEZE_MB: ${{ inputs.squeeze_mb }}
          E2E_SERVER_INSTALL: ${{ inputs.install }}
        run: tests/e2e/ci.sh
      - name: Logs readable (QEMU writes them as root; a cancelled run skips the lab's own fix)
        if: always()
        run: sudo chmod -R a+rX tests/e2e/work 2>/dev/null || true
      - name: Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-logs
          # Logs only: not the VM's disk or firmware variables.
          path: |
            tests/e2e/work/
            !tests/e2e/work/*.qcow2
            !tests/e2e/work/*.fd
            !tests/e2e/work/*.iso
            !tests/e2e/work/*.sock
          if-no-files-found: ignore
          retention-days: 14
